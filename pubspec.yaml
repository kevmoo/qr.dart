name: qr
version: 4.0.1-wip
description: >-
  A QR code generation library for Dart.
  Supports QR code version 1 through 40, error correction and redundancy.
repository: https://github.com/kevmoo/qr.dart
screenshots:
  - description: 'Rich interactive QR Code generation demo'
    path: example/assets/qr_kevmoo_screen_shot.webp

environment:
  sdk: ^3.13.0

dependencies:
  meta: ^1.7.0

dev_dependencies:
  api_summary: ^1.2.0
  args: ^2.7.0
  bench_press: ^0.4.2
  build_runner: ^2.16.2
  build_web_compilers: ^4.8.12
  characters: ^1.4.1
  checks: ^0.3.2
  dart_flutter_team_lints: ^3.5.2
  path: ^1.9.1
  test: ^1.33.0
  test_process: ^2.1.1
  web: ^1.1.2
